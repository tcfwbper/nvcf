# The agents' /metrics for the cluster's Prometheus (docs/operate/METRICS.md):
# served on the API port, without authentication.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nvsnap-agent
  {{- /* A namespace the cluster lacks would fail the install: use the
       release's instead. lookup answers only against a live cluster; under
       helm template or a GitOps renderer it finds nothing, not even
       kube-system, and the configured namespace stands. The release's own
       namespace is used without a lookup. A lookup the installer may not
       make fails the install; an installer that may create the agent's
       ClusterRole (agent-rbac.yaml grants get on namespaces) may make it,
       unless it creates roles through the escalate verb alone: such an
       installer sets namespace "" (the release's). */}}
  {{- $smNS := $sm.namespace | default .Release.Namespace }}
  {{- if and (ne $smNS .Release.Namespace) (lookup "v1" "Namespace" "" "kube-system") (not (lookup "v1" "Namespace" "" $smNS)) }}{{ $smNS = .Release.Namespace }}{{ end }}
  namespace: {{ $smNS }}
  labels:
    {{- include "nvsnap.agent.labels" . | nindent 4 }}
    {{- range $k, $v := $sm.labels }}
    {{ $k }}: {{ $v | toString | quote }}
    {{- end }}
spec:
  # The headless agent Service alone: the node-local one has the same
  # agent labels and would scrape every agent twice.
  selector:
    matchLabels:
      nvsnap.io/metrics: agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  endpoints:
    - port: http-api
      path: /metrics
      interval: {{ $sm.interval }}
{{- end }}
