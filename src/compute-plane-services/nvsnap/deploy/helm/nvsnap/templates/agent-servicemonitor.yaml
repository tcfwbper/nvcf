{{- $sm := .Values.agent.metrics.serviceMonitor }}
{{- $on := toString $sm.enabled }}
{{- if and .Values.agent.enabled (or (eq $on "true") (and (eq $on "auto") (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor"))) }}
{{- /* Guard first: a disabled feature must emit nothing at all (see grafana-dashboard.yaml). */ -}}
