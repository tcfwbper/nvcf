# CI indexes the image settings below. A chart must not choose an image
# source: registry and repository belong in the stack base.yaml or a values
# file. This chart still prefills them, so it renders without them today, and
# is pending-fix in tools/docs-version-sync/chart-image-exclusions.yaml. Once
# fixed, it must fail to render when either source is missing.
# An image whose tag and digest are both empty inherits the vendored chart's
# appVersion, keeping the shared version in one place. A digest with an empty
# tag renders a digest-only reference.
thirdPartyImages:
  certManagerController: cert-manager.image
  certManagerWebhook: cert-manager.webhook.image
  certManagerCAInjector: cert-manager.cainjector.image
  certManagerStartupAPICheck: cert-manager.startupapicheck.image
  certManagerACMESolver: cert-manager.acmesolver.image

cert-manager:
  imageRegistry: quay.io
  imageNamespace: jetstack

  image:
    name: cert-manager-controller
    repository: ""
    tag: ""
    digest: ""

  crds:
    enabled: true

  replicaCount: 1

  webhook:
    replicaCount: 1
    image:
      name: cert-manager-webhook
      repository: ""
      tag: ""
      digest: ""

  cainjector:
    replicaCount: 1
    image:
      name: cert-manager-cainjector
      repository: ""
      tag: ""
      digest: ""

  startupapicheck:
    image:
      name: cert-manager-startupapicheck
      repository: ""
      tag: ""
      digest: ""

  acmesolver:
    image:
      name: cert-manager-acmesolver
      repository: ""
      tag: ""
      digest: ""

  prometheus:
    enabled: false

  global:
    leaderElection:
      namespace: cert-manager
