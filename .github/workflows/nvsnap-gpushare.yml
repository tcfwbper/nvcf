#
# Compile nvsnap's gpushare C code (libnvsnap_gpushare.so, nvsnap-gpu-suspend
# and its GPU tests) for amd64 and arm64 with warnings as errors. The Bazel row
# for nvsnap covers its Go code only, so without this job a change to the C
# code is first compiled when the agent base image is built. Runs only when the
# C code, its build or this workflow changes; no GPU is needed to compile.
# On amd64 it also runs the host tests, which drive nvsnap-gpu-suspend against
# fake ranks and a stub libcuda.

name: nvsnap gpushare

on:
  push:
    branches: [main, 'release-**']
    paths: &paths
      - 'src/compute-plane-services/nvsnap/docker/agent/gpushare/**'
      - 'src/compute-plane-services/nvsnap/tests/gpushare/**'
      - 'src/compute-plane-services/nvsnap/docker/agent/Dockerfile.base'
      - 'src/compute-plane-services/nvsnap/scripts/check-gpushare-build.sh'
      - '.github/workflows/nvsnap-gpushare.yml'
  pull_request:
    branches: [main, 'release-**']
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvsnap-gpushare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build gpushare (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Compile with warnings as errors
        env:
          PLATFORMS: ${{ matrix.platform }}
        run: src/compute-plane-services/nvsnap/scripts/check-gpushare-build.sh

      - name: Host tests (no GPU)
        if: matrix.platform == 'linux/amd64'
        shell: bash
        run: |
          nvsnap=src/compute-plane-services/nvsnap
          cuda="$(awk '/^FROM .* AS cuda-headers$/ { print $(NF-2) }' "$nvsnap/docker/agent/Dockerfile.base")"
          hdr="$(mktemp -d)"
          cid="$(docker create "$cuda")"
          docker cp "$cid:/usr/local/cuda/include/cuda.h" "$hdr/cuda.h"
          docker rm "$cid" >/dev/null
          # test_ibv.py compiles against the rdma-core headers.
          sudo apt-get install -y -q libibverbs-dev >/dev/null
          # Every host test file runs, so a new one cannot be left out. A test
          # that skips (no gcc or cuda.h) still exits 0: fail on it here.
          for t in "$nvsnap"/tests/gpushare/host/test_*.py; do
            CUDA_INC="$hdr" python3 -I "$t" 2>&1 | tee "$hdr/out"
            if grep -q "skipped" "$hdr/out"; then echo "$t: host tests skipped" >&2; exit 1; fi
          done
