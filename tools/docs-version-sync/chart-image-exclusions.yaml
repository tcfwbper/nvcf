# Chart image coverage exclusions, read by TestChartImageCoverage.
#
# Every tracked Chart.yaml must either declare an image index (thirdPartyImages
# or ownedImages in its values.yaml) and pass image coverage, or be listed here.
# Keys are chart directories relative to the repository root.
#
# reason:
#   pending-fix        Not yet remediated. Expected to fail coverage. Once the
#                      chart passes, CI fails until this entry is removed.
#   test-fixture       Testdata, validator test charts, and samples that no
#                      NVCF stack deploys. Skipped.
#   no-runtime-image   Renders no image in its defaults or any CI values
#                      scenario in tools/ci/helm-chart-values.yaml. Confirmed
#                      by rendering.
#   vendored-subchart  Lives at <parent>/charts/<name>, where <parent> is
#                      itself a chart. Skipped.
#
# issue (optional, pending-fix only): a free-form note, such as a tracking
# link. It is not validated. This file is public, so keep private tracker IDs
# and URLs out of it.
#
# A chart with an image index may only be listed as pending-fix. Indirect
# images (arguments, environment, injected agents) are visible only through
# the patterns registered in the release inventory scanner. See the
# indirect-image convention in tools/docs-version-sync/AGENTS.md.

