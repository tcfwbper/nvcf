# CI-only scenario: every optional route, the gRPC sub-routes, pod monitors
# and cert-manager gRPC TLS enabled at once. Fake required values use
# example.invalid.
nvcfGatewayRoutes:
  domain: ci.example.invalid
  routes:
    nvcfApi:
      grpc:
        enabled: true
        hostnames:
          - "grpc-api.{{ .Values.nvcfGatewayRoutes.domain }}"
    nvctApi:
      grpc:
        enabled: true
        hostnames:
          - "grpc-tasks.{{ .Values.nvcfGatewayRoutes.domain }}"
    llmInvocation:
      enabled: true
    vanityGateway:
      enabled: true
    nvcfUi:
      enabled: true
    grpcWorker:
      enabled: true
    nats:
      enabled: true
    llmWorker:
      enabled: true
      backend:
        namespace: ci-llm-router
    ess:
      enabled: true
  podMonitors:
    enabled: true
llmRequestRouter:
  grpcTls:
    enabled: true
    mode: certManager
    secretName: ci-llm-worker-grpc-tls
    dnsNames:
      - llm-worker.ci.example.invalid
    issuerRef:
      name: ci-issuer
